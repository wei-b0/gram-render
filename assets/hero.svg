<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>gram-render — prompt + context in, a live Telegram message out, edited in place on follow-up prompts</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4C5766"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="620" rx="20" fill="#0D1117"/>

  <!-- ===== left column: the input ===== -->
  <text x="40" y="74" font-size="22" font-weight="700" fill="#F0F6FC">gram-render</text>
  <text x="40" y="96" font-size="12" fill="#8B949E">JEV · TypeSafe System One</text>

  <rect x="40" y="128" width="340" height="190" rx="12" fill="#161B22" stroke="#30363D"/>
  <circle cx="60" cy="148" r="4" fill="#F2748C"/>
  <circle cx="74" cy="148" r="4" fill="#D9A440"/>
  <circle cx="88" cy="148" r="4" fill="#6EC46A"/>
  <text x="104" y="152" font-size="11" fill="#8B949E" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">demo.ts</text>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5">
    <text x="58" y="180" fill="#E6EDF3">render({</text>
    <text x="58" y="199" fill="#A5D6FF">  prompt: 'Show this order. Quote</text>
    <text x="58" y="218" fill="#A5D6FF">    "Order #1842" as the heading.',</text>
    <text x="58" y="237" fill="#E6EDF3"><tspan fill="#79C0FF">  context</tspan>: { order: { … },</text>
    <text x="58" y="256" fill="#E6EDF3"><tspan fill="#79C0FF">    actions</tspan>: [ … ] },</text>
    <text x="58" y="275" fill="#E6EDF3">})</text>
  </g>

  <text x="40" y="352" font-size="12" fill="#8B949E">≈ 2 JEV calls · every word from your data</text>
  <text x="40" y="374" font-size="12" fill="#8B949E">JEV never authors a word — it chooses.</text>

  <!-- ===== arrow ===== -->
  <path d="M388 224 L456 224" stroke="#4C5766" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== right column: the Telegram chat ===== -->
  <rect x="470" y="40" width="690" height="540" rx="18" fill="#0E1621" stroke="#1C2A3A"/>

  <!-- chat header -->
  <circle cx="502" cy="78" r="14" fill="#3390EC"/>
  <text x="502" y="83" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">g</text>
  <text x="524" y="78" font-size="13.5" font-weight="600" fill="#E9EDF0">gram-render demo</text>
  <text x="524" y="94" font-size="11" fill="#708183">bot</text>
  <line x1="470" y1="112" x2="1160" y2="112" stroke="#1C2A3A"/>

  <!-- bubble 1: the rendered order card -->
  <rect x="494" y="128" width="500" height="186" rx="14" fill="#182533"/>
  <text x="514" y="154" font-size="15" font-weight="700" fill="#FFFFFF">Order #1842</text>
  <text x="514" y="177" font-size="13"><tspan fill="#8FA3B0">Customer: </tspan><tspan fill="#E9EDF0">Maya Patel</tspan></text>
  <text x="514" y="196" font-size="13"><tspan fill="#8FA3B0">Total: </tspan><tspan fill="#E9EDF0">$102.00</tspan></text>
  <text x="514" y="215" font-size="13" fill="#E9EDF0">•  Linen shirt × 2</text>
  <text x="514" y="234" font-size="13" fill="#E9EDF0">•  Canvas tote × 1</text>

  <rect x="514" y="242" width="98" height="22" rx="11" fill="#4EA7FC" opacity="0.15"/>
  <circle cx="528" cy="253" r="3.5" fill="#4EA7FC"/>
  <text x="536" y="257" font-size="11.5" fill="#4EA7FC">processing</text>
  <rect x="620" y="242" width="58" height="22" rx="11" fill="#6EC46A" opacity="0.15"/>
  <circle cx="634" cy="253" r="3.5" fill="#6EC46A"/>
  <text x="642" y="257" font-size="11.5" fill="#6EC46A">paid</text>

  <rect x="514" y="270" width="150" height="32" rx="16" fill="#1C2A39" stroke="#2B3B4D"/>
  <text x="589" y="290" font-size="12.5" fill="#6AB3F3" text-anchor="middle">Mark as packed</text>
  <rect x="674" y="270" width="130" height="32" rx="16" fill="#1C2A39" stroke="#2B3B4D"/>
  <text x="739" y="290" font-size="12.5" fill="#6AB3F3" text-anchor="middle">Cancel order</text>
  <text x="986" y="306" font-size="10" fill="#708183" text-anchor="end">12:01</text>

  <!-- user bubble: a typed edit -->
  <rect x="946" y="330" width="190" height="36" rx="18" fill="#2B5278"/>
  <text x="1041" y="353" font-size="13" fill="#FFFFFF" text-anchor="middle">Make it compact.</text>

  <!-- bubble 2: the same message, edited in place -->
  <rect x="494" y="382" width="500" height="106" rx="14" fill="#182533"/>
  <text x="514" y="408" font-size="14" font-weight="700" fill="#FFFFFF">Order #1842</text>
  <text x="514" y="430" font-size="13"><tspan fill="#4EA7FC">● </tspan><tspan fill="#8FA3B0">processing   </tspan><tspan fill="#6EC46A">✓ </tspan><tspan fill="#8FA3B0">paid   </tspan><tspan fill="#E9EDF0">$102.00</tspan></text>

  <rect x="514" y="444" width="150" height="32" rx="16" fill="#1C2A39" stroke="#2B3B4D"/>
  <text x="589" y="464" font-size="12.5" fill="#6AB3F3" text-anchor="middle">Mark as packed</text>
  <rect x="674" y="444" width="130" height="32" rx="16" fill="#1C2A39" stroke="#2B3B4D"/>
  <text x="739" y="464" font-size="12.5" fill="#6AB3F3" text-anchor="middle">Cancel order</text>
  <text x="986" y="480" font-size="10" fill="#708183" text-anchor="end">12:02</text>

  <text x="514" y="504" font-size="11.5" fill="#708183">same message · edited in place · every word still from your data</text>

  <!-- typing indicator -->
  <rect x="494" y="522" width="64" height="30" rx="15" fill="#182533"/>
  <circle cx="514" cy="537" r="3" fill="#4C5766"/>
  <circle cx="526" cy="537" r="3" fill="#5A6470"/>
  <circle cx="538" cy="537" r="3" fill="#6B7683"/>
</svg>
